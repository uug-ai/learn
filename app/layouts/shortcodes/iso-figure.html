{{- /*
  iso-figure shortcode — embed an isometric illustration from the design library.

  Usage:
    {{< iso-figure figure="hub" caption="How an event moves through Hub." >}}

  The SVG in assets/iso/<figure>.svg is generated from the design library
  (uug-ai/design, renderIsoSvg) with ISO_ID as a placeholder for the filter ids;
  the styles live in assets/css/iso-illustration.css, loaded with the click
  script from _partials/custom/head-end.html on pages that use this shortcode
  (a per-page flag here would survive dev-server rebuilds and drop the
  stylesheet after the first one). The figure animates with
  CSS only, glows in dark mode and holds a lit frame under reduced motion.
  Parts the figure marks with data-iso-at replay their moment when clicked
  (assets/js/iso-figure.js). A figure with links (the ecosystem map, exported
  with renderIsoSvg's links option) is labelled as a group, not an image, so
  its links stay reachable for keyboard and screen-reader users.
*/ -}}

{{- $figure := .Get "figure" | default "hub" -}}
{{- $caption := .Get "caption" -}}
{{- $alt := .Get "alt" | default $caption -}}
{{- $svg := resources.Get (printf "iso/%s.svg" $figure) -}}
{{- if not $svg -}}
  {{- errorf "iso-figure: no assets/iso/%s.svg (used at %s)" $figure .Position -}}
{{- end -}}
{{- $id := printf "iso-%s-%d" $figure .Ordinal -}}
{{- $role := cond (strings.Contains $svg.Content "<a ") "group" "img" -}}

<figure class="iso-illustration-figure">
  <div class="iso-illustration iso-illustration--glow-auto" {{ with $alt }}role="{{ $role }}" aria-label="{{ . }}"{{ else }}aria-hidden="true"{{ end }}>
    {{- replace $svg.Content "ISO_ID" $id | safeHTML -}}
  </div>
  {{ with $caption }}<figcaption>{{ . | markdownify }}</figcaption>{{ end }}
</figure>
