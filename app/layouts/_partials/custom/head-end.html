<script>
  (function () {
    'use strict';

    // Selector for content images that should be clickable.
    // Restrict to images inside the main article body to avoid logos / icons.
    var IMG_SELECTOR =
      'main article img, .content img, main .hextra-max-page-width img';

    // Skip tiny images and obvious icons.
    function isEligible(img) {
      if (img.dataset.lightboxBound === '1') return false;
      if (img.closest('a')) return false; // already linked
      if (img.closest('.lightbox-modal')) return false;
      var w = img.naturalWidth || img.width || 0;
      var h = img.naturalHeight || img.height || 0;
      if (w && w < 80) return false;
      if (h && h < 80) return false;
      var cls = (img.className || '').toLowerCase();
      if (cls.indexOf('no-lightbox') !== -1) return false;
      if (cls.indexOf('emoji') !== -1) return false;
      return true;
    }

    var modal, stage, imgEl, hintEl;
    var scale = 1, tx = 0, ty = 0;
    var dragging = false, dragStartX = 0, dragStartY = 0, startTx = 0, startTy = 0;
    var MIN_SCALE = 0.2, MAX_SCALE = 10;

    function buildModal() {
      if (modal) return;
      modal = document.createElement('div');
      modal.className = 'lightbox-modal';
      modal.setAttribute('role', 'dialog');
      modal.setAttribute('aria-modal', 'true');
      modal.setAttribute('aria-hidden', 'true');
      modal.innerHTML =
        '<div class="lightbox-modal__stage">' +
        '<img class="lightbox-modal__img" alt="" />' +
        '</div>' +
        '<div class="lightbox-modal__toolbar">' +
        '<button type="button" class="lightbox-modal__btn" data-action="zoom-out" aria-label="Zoom out">&minus;</button>' +
        '<button type="button" class="lightbox-modal__btn" data-action="reset" aria-label="Reset zoom">&#8634;</button>' +
        '<button type="button" class="lightbox-modal__btn" data-action="zoom-in" aria-label="Zoom in">+</button>' +
        '<button type="button" class="lightbox-modal__btn" data-action="close" aria-label="Close">&times;</button>' +
        '</div>' +
        '<div class="lightbox-modal__hint">Scroll to zoom &middot; Drag to pan &middot; Esc to close</div>';
      document.body.appendChild(modal);

      stage = modal.querySelector('.lightbox-modal__stage');
      imgEl = modal.querySelector('.lightbox-modal__img');
      hintEl = modal.querySelector('.lightbox-modal__hint');

      modal.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-action]');
        if (btn) {
          var action = btn.getAttribute('data-action');
          if (action === 'close') return close();
          if (action === 'zoom-in') return zoomBy(1.25);
          if (action === 'zoom-out') return zoomBy(1 / 1.25);
          if (action === 'reset') return resetTransform();
          return;
        }
        // Click on backdrop (outside the image) closes.
        if (e.target === modal || e.target === stage) close();
      });

      stage.addEventListener('wheel', function (e) {
        e.preventDefault();
        var rect = stage.getBoundingClientRect();
        var cx = e.clientX - rect.left - rect.width / 2;
        var cy = e.clientY - rect.top - rect.height / 2;
        var factor = Math.exp(-e.deltaY * 0.0015);
        zoomAt(factor, cx, cy);
      }, { passive: false });

      stage.addEventListener('mousedown', function (e) {
        if (e.button !== 0) return;
        dragging = true;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        startTx = tx;
        startTy = ty;
        stage.classList.add('is-grabbing');
        e.preventDefault();
      });

      window.addEventListener('mousemove', function (e) {
        if (!dragging) return;
        tx = startTx + (e.clientX - dragStartX);
        ty = startTy + (e.clientY - dragStartY);
        applyTransform();
      });

      window.addEventListener('mouseup', function () {
        if (!dragging) return;
        dragging = false;
        stage.classList.remove('is-grabbing');
      });

      // Touch support: pinch + pan.
      var touchStart = null;
      stage.addEventListener('touchstart', function (e) {
        if (e.touches.length === 1) {
          touchStart = {
            mode: 'pan',
            x: e.touches[0].clientX,
            y: e.touches[0].clientY,
            tx: tx, ty: ty
          };
        } else if (e.touches.length === 2) {
          var dx = e.touches[0].clientX - e.touches[1].clientX;
          var dy = e.touches[0].clientY - e.touches[1].clientY;
          touchStart = {
            mode: 'pinch',
            dist: Math.hypot(dx, dy),
            scale: scale,
            cx: (e.touches[0].clientX + e.touches[1].clientX) / 2,
            cy: (e.touches[0].clientY + e.touches[1].clientY) / 2
          };
        }
      }, { passive: true });

      stage.addEventListener('touchmove', function (e) {
        if (!touchStart) return;
        if (touchStart.mode === 'pan' && e.touches.length === 1) {
          tx = touchStart.tx + (e.touches[0].clientX - touchStart.x);
          ty = touchStart.ty + (e.touches[0].clientY - touchStart.y);
          applyTransform();
          e.preventDefault();
        } else if (touchStart.mode === 'pinch' && e.touches.length === 2) {
          var dx = e.touches[0].clientX - e.touches[1].clientX;
          var dy = e.touches[0].clientY - e.touches[1].clientY;
          var dist = Math.hypot(dx, dy);
          var rect = stage.getBoundingClientRect();
          var cx = touchStart.cx - rect.left - rect.width / 2;
          var cy = touchStart.cy - rect.top - rect.height / 2;
          var newScale = clamp(touchStart.scale * (dist / touchStart.dist), MIN_SCALE, MAX_SCALE);
          var factor = newScale / scale;
          zoomAt(factor, cx, cy);
          e.preventDefault();
        }
      }, { passive: false });

      stage.addEventListener('touchend', function () { touchStart = null; });

      // Double-click toggles between fit and 2x.
      stage.addEventListener('dblclick', function (e) {
        if (scale > 1.01) {
          resetTransform();
        } else {
          var rect = stage.getBoundingClientRect();
          var cx = e.clientX - rect.left - rect.width / 2;
          var cy = e.clientY - rect.top - rect.height / 2;
          zoomAt(2, cx, cy);
        }
      });
    }

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    function applyTransform() {
      imgEl.style.transform =
        'translate(calc(-50% + ' + tx + 'px), calc(-50% + ' + ty + 'px)) scale(' + scale + ')';
    }

    function resetTransform() {
      scale = 1; tx = 0; ty = 0;
      applyTransform();
    }

    function zoomBy(factor) { zoomAt(factor, 0, 0); }

    function zoomAt(factor, cx, cy) {
      var newScale = clamp(scale * factor, MIN_SCALE, MAX_SCALE);
      var actual = newScale / scale;
      // Keep the point under (cx,cy) stable.
      tx = cx - (cx - tx) * actual;
      ty = cy - (cy - ty) * actual;
      scale = newScale;
      applyTransform();
    }

    function open(src, alt) {
      buildModal();
      imgEl.src = src;
      imgEl.alt = alt || '';
      resetTransform();
      modal.classList.add('is-open');
      modal.setAttribute('aria-hidden', 'false');
      document.body.classList.add('lightbox-open');
    }

    function close() {
      if (!modal) return;
      modal.classList.remove('is-open');
      modal.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('lightbox-open');
      // Free the image after the transition.
      setTimeout(function () {
        if (!modal.classList.contains('is-open')) imgEl.src = '';
      }, 250);
    }

    document.addEventListener('keydown', function (e) {
      if (!modal || !modal.classList.contains('is-open')) return;
      if (e.key === 'Escape') close();
      else if (e.key === '+' || e.key === '=') zoomBy(1.25);
      else if (e.key === '-' || e.key === '_') zoomBy(1 / 1.25);
      else if (e.key === '0') resetTransform();
    });

    function bindImages(root) {
      var imgs = (root || document).querySelectorAll(IMG_SELECTOR);
      imgs.forEach(function (img) {
        if (!isEligible(img)) return;
        img.dataset.lightboxBound = '1';
        img.addEventListener('click', function (e) {
          e.preventDefault();
          open(img.currentSrc || img.src, img.alt);
        });
      });
    }

    function init() {
      bindImages(document);
      // Re-scan on DOM mutations (e.g. client-side nav, lazy content).
      if ('MutationObserver' in window) {
        var mo = new MutationObserver(function (records) {
          for (var i = 0; i < records.length; i++) {
            var added = records[i].addedNodes;
            for (var j = 0; j < added.length; j++) {
              if (added[j].nodeType === 1) bindImages(added[j]);
            }
          }
        });
        mo.observe(document.body, { childList: true, subtree: true });
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
</script>
