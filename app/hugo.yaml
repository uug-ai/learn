# Hugo configuration file
title: 

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 1
    - identifier: knowledge-base
      name: Knowledge base
      pageRef: /knowledge-base
      weight: 2
    - name: Tutorials
      pageRef: /tutorials
      parent: knowledge-base
      weight: 1
      params:
        description: Step-by-step walkthroughs to get hands-on with our products.
    - name: Guides
      pageRef: /guides
      parent: knowledge-base
      weight: 2
      params:
        description: In-depth how-tos for common tasks and workflows.
    - name: Blog
      pageRef: /blog
      parent: knowledge-base
      weight: 3
      params:
        description: Latest news, announcements and deep-dives from the team.
    - name: Support
      pageRef: /support
      weight: 6
    - name: Designer
      pageRef: /designer
      weight: 6.5
    - name: Search
      weight: 7
      params:
        type: search
    - name: Theme
      weight: 7.5
      params:
        type: theme-toggle
    - name: GitHub
      weight: 8
      url: "https://github.com/uug-ai/documentation"
      params:
        icon: github

params:
  navbar:
    displayTitle: true
    displayLogo: false
    brandText: UUG
    logo:
      path: images/logo.svg
      dark: images/logo-dark.svg
      link: /
      width: 40

  footer:
    displayCopyright: false
    displayPoweredBy: false

  theme:
    # Theme switching lives in the top navbar (see the "Theme" menu entry).
    # Disable Hextra's sidebar/footer toggles to avoid duplicate controls.
    displayToggle: false

  editURL:
    enable: true
    base: "https://github.com/uug-ai/documentation/edit/main/app/content"

  hextra:
    enable: true
    assets:
      css:
        - path: css/custom.css
security:
  http:
    urls:
      - '^https://cdn\.jsdelivr\.net/'
