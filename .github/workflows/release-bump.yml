name: Bump release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        required: true
        default: fix
        type: choice
        options:
          - major
          - minor
          - fix

permissions:
  contents: write

jobs:
  bump-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        env:
          BUMP: ${{ github.event.inputs.bump }}
        run: |
          set -euo pipefail

          # Get the latest semver tag, default to v0.0.0 when none exist.
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$latest" ]; then
            latest="v0.0.0"
          fi
          echo "Latest tag: $latest"

          # Strip the leading "v" and split into components.
          version="${latest#v}"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"

          case "$BUMP" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            fix)
              patch=$((patch + 1))
              ;;
          esac

          next="v${major}.${minor}.${patch}"
          echo "Next tag: $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

  # Run the original release pipeline for the freshly created tag.
  # A release created with the default GITHUB_TOKEN does not emit the
  # `release: created` event, so we invoke the reusable workflow directly.
  release:
    needs: bump-release
    uses: uug-ai/workflows/.github/workflows/release-create.yml@main
    with:
      project: ${{ github.event.repository.name }}
      tag: ${{ needs.bump-release.outputs.tag }}
      docker_context: "."
      runner_matrix: '[{"architecture":"amd64","runner":"ubuntu-24.04"},{"architecture":"arm64","runner":"ubuntu-24.04-arm"}]'
      create_gitops_pr: true
      gitops_repo: "uug-ai/gitops"
      gitops_file: "environments/staging/learn/deployment.yaml"
      gitops_key: ".spec.template.spec.containers[0].image"
      gitops_value: "ghcr.io/uug-ai/learn:${{ needs.bump-release.outputs.tag }}"
    secrets: inherit
